# Build, unit tests and the three plugin validators (area 01: "Add pluginval, the VST3 validator
# and clap-validator to CI on both platforms"; "CI builds both" host-check configurations).
#
#   windows         shipping build (host checks off): ctest, clap-validator, pluginval at
#                   strictness 10 and the Steinberg VST3 validator.
#   windows-strict  AMQ_STRICT_HOST_CHECKS=ON: any CLAP host contract violation aborts. ctest
#                   and clap-validator (the plugin host test is shipping-only by design).
#   macos           the same as windows, native arm64 with the default Makefiles generator
#                   (universal binaries are part of the macOS task). Allowed to fail until
#                   the first macOS build task in area 01 is done; remove continue-on-error
#                   then.
#
# The windows job also uploads the binary build: Am-Q-<version>-windows-x64 (Am-Q.clap, the
# Am-Q.vst3 bundle, INSTALL.txt and THIRD_PARTY_NOTICES.txt) and its debug symbols as a separate
# -symbols artifact. A v* tag also runs the release job, which publishes both as a GitHub Release.
#
# Validator binaries are pinned by version and SHA-256 in tools/ci/fetch_validators.sh.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            platform: windows
            strict: OFF
            experimental: false
            generator: -G "Visual Studio 17 2022" -A x64
          - name: windows-strict
            os: windows-2022
            platform: windows
            strict: ON
            experimental: false
            generator: -G "Visual Studio 17 2022" -A x64
          - name: macos
            os: macos-15
            platform: macos
            strict: OFF
            experimental: true
            generator: ""
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build ${{ matrix.generator }}
          -DCMAKE_BUILD_TYPE=Release
          -DAMQ_BUILD_PLUGIN=ON
          -DAMQ_STRICT_HOST_CHECKS=${{ matrix.strict }}

      # A release tag must name the version the build carries (project(VERSION) in CMakeLists.txt).
      - name: Check the tag matches the version
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          v=$(sed -n 's/^#define AMQ_VERSION "\(.*\)"$/\1/p' build/generated/amq_version.h)
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project(VERSION $v) in CMakeLists.txt"
            exit 1
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build the VST3 validator and the VST3 host test
        if: matrix.strict == 'OFF'
        run: |
          cmake -S tools/vst3_tools -B build-vst3-tools ${{ matrix.generator }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_AMQ_VST3SDK="$GITHUB_WORKSPACE/build/_deps/amq_vst3sdk-src"
          cmake --build build-vst3-tools --config Release --parallel
          exe=$(find build-vst3-tools -type f \( -name validator -o -name validator.exe \) | head -n 1)
          echo "VST3_VALIDATOR=$GITHUB_WORKSPACE/$exe" >> "$GITHUB_ENV"

      # Shipping build only: like the CLAP host test, it makes off-main-thread calls on purpose,
      # which the strict host checks turn into an abort.
      - name: VST3 host test
        if: matrix.strict == 'OFF' && matrix.platform == 'windows'
        run: |
          vst3=$(find build -path '*/_deps' -prune -o -name Am-Q.vst3 -print -prune | head -n 1)
          build-vst3-tools/Release/amq_vst3_host_test.exe "$vst3"

      - name: Fetch clap-validator and pluginval
        run: bash tools/ci/fetch_validators.sh "$RUNNER_TEMP/validators" ${{ matrix.platform }}

      - name: Run validators
        run: >
          bash tools/ci/run_validators.sh build "$RUNNER_TEMP/validators" validator-logs
          ${{ matrix.strict == 'ON' && '-' || '"$VST3_VALIDATOR"' }}

      - name: Upload validator logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validator-logs-${{ matrix.name }}
          path: validator-logs
          if-no-files-found: ignore

      # The binary build: the shipping plugins as an installable package, with the debug symbols
      # in a separate artifact, named after the version the plugins report: Am-Q-0.1.0-windows-x64
      # on a v0.1.0 tag, otherwise Am-Q-0.1.0+<short hash>-windows-x64.
      - name: Package plugins
        if: success() && matrix.strict == 'OFF' && matrix.platform == 'windows'
        run: |
          ver=$(tr -d '\r\n' < build/generated/amq_version.txt)
          pkg="Am-Q-$ver-windows-x64"
          clap=$(find build -path '*/_deps' -prune -o -type f -name Am-Q.clap -print | head -n 1)
          vst3=$(find build -path '*/_deps' -prune -o -type d -name Am-Q.vst3 -print -prune | head -n 1)
          test -n "$clap" && test -n "$vst3"
          mkdir -p "dist/$pkg" "dist/$pkg-symbols"
          cp "$clap" "dist/$pkg/"
          cp -r "$vst3" "dist/$pkg/"
          # Symbols: out of the bundle, named after the plugin they belong to.
          find "dist/$pkg/Am-Q.vst3" -name '*.pdb' -exec mv {} "dist/$pkg-symbols/Am-Q.vst3.pdb" \;
          cp "$(dirname "$clap")/Am-Q.pdb" "dist/$pkg-symbols/Am-Q.clap.pdb"
          # The licences of everything linked or embedded in the binaries (they require it).
          bash tools/ci/third_party_notices.sh build "dist/$pkg/THIRD_PARTY_NOTICES.txt"
          cat > "dist/$pkg/INSTALL.txt" <<EOF
          Am-Q $ver (Windows, x64)
          Built from commit $GITHUB_SHA.

          CLAP: copy Am-Q.clap to C:\Program Files\Common Files\CLAP
          VST3: copy the Am-Q.vst3 folder to C:\Program Files\Common Files\VST3
          Then rescan plugins in your host.

          Third-party licences: THIRD_PARTY_NOTICES.txt
          EOF
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: Upload the package
        if: success() && matrix.strict == 'OFF' && matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}
          if-no-files-found: error

      - name: Upload the symbols
        if: success() && matrix.strict == 'OFF' && matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}-symbols
          path: dist/${{ env.PKG }}-symbols
          if-no-files-found: error

  # Release: a v* tag (it must match project(VERSION); the build's tag check fails otherwise)
  # publishes a GitHub Release with the Windows package and its symbols as zips. It waits for the
  # build matrix and goes ahead only if both Windows jobs passed (macOS is not required yet).
  release:
    name: release
    needs: build
    if: always() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      actions: read     # read this run's jobs and artifacts
    steps:
      - name: Require the Windows jobs to have passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs                --jq '[.jobs[] | select(.name == "windows" or .name == "windows-strict") | .conclusion] | length == 2 and all(. == "success")')
          if [ "$ok" != "true" ]; then
            echo "::error::the windows and windows-strict jobs must pass before a release"
            exit 1
          fi

      - name: Download the package and symbols
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'Am-Q-*' --dir dist

      - name: Zip them
        run: |
          cd dist
          for d in */; do zip -qr "${d%/}.zip" "${d%/}"; done
          ls -l *.zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip
          --repo "$GITHUB_REPOSITORY"
          --title "Am-Q ${GITHUB_REF_NAME#v}"
          --generate-notes
          --verify-tag
