      <button class="hbtn" style="left: {{b.left}}px; top: {{b.top}}px; width: {{b.size}}px; height: {{b.size}}px; background: {{b.color}}; box-shadow: {{b.ring}};" aria-label="{{b.aria}}" aria-pressed="{{b.selected}}" onClick="{{b.pick}}" title="{{b.tip}}"></button>
    </sc-for>

    <div class="amq-readout" style="position: absolute; left: {{sel.rx}}px; top: {{sel.ry}}px; box-shadow: 0 0 0 1px #3d3c43;">

      <span>{{sel.freq}}</span><sc-if value="{{sel.hasGain}}" hint-placeholder-val="{{true}}"><span style="color: var(--ink-muted);">·</span><span>{{sel.gain}}</span></sc-if><span style="color: var(--ink-muted);">·</span><span>{{sel.q}}</span>

    <!-- Band panel -->
    <section class="amq-panel" aria-label="Band editor" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 16px; padding: 16px 20px;">
      <div style="display: flex; align-items: center; gap: 24px;">
        <div style="display: flex; flex-direction: column; gap: 8px; width: 148px;">
          <div style="display: flex; align-items: center; gap: 8px;">

            <span style="flex-grow: 1;"></span>
            <button class="amq-icon" aria-label="Band enabled" aria-pressed="true" title="Enable/disable band (Alt-click the handle)"><svg viewBox="0 0 16 16"><path d="M8 2 V8"></path><path d="M4.5 4.5 A5 5 0 1 0 11.5 4.5"></path></svg></button>

        <div style="display: flex; align-items: flex-end; gap: 16px;">

                <path class="value" d="{{k.arc}}" stroke-width="{{k.sw}}"></path>
                <path class="tick" d="{{k.tick}}" stroke-width="2"></path>
              </svg>
              <span class="lbl">{{k.label}}</span>
              <span class="val">{{k.val}}</span>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{sel.dyn}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding-left: 24px; box-shadow: -1px 0 0 #3d3c43;">
            <button class="chip {{sel.autoClass}}" aria-pressed="{{sel.auto}}" onClick="{{toggleAuto}}" title="Auto threshold: follows the band's own level">Auto</button>

                    <circle class="face" cx="{{k.c}}" cy="{{k.c}}" r="{{k.fr}}"></circle>
                    <path class="track" d="{{k.track}}" stroke-width="{{k.sw}}"></path>
                    <path class="value" d="{{k.arc}}" stroke-width="{{k.sw}}"></path>
                    <path d="{{k.gr}}" fill="none" stroke="{{k.grc}}" stroke-width="2" stroke-linecap="round"></path>
                    <path class="tick" d="{{k.tick}}" stroke-width="2"></path>
                  </svg>
                  <span class="lbl">{{k.label}}</span>
                  <span class="val">{{k.val}}</span>
                </div>
              </sc-for>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px; width: 148px;">
            <span style="font: 600 12px/14px var(--font-sans); letter-spacing: 0.06em; color: var(--ink-muted);">SIDE CHAIN</span>
            <div style="display: flex; gap: 4px;">
              <button class="chip on" style="height: 28px; flex-grow: 1;" aria-pressed="true">Int</button>
              <button class="chip" style="height: 28px; flex-grow: 1;" aria-pressed="false">Ext</button>
              <button class="amq-icon" aria-label="Listen to side chain" title="Listen"><svg viewBox="0 0 16 16"><path d="M3 10 V8 A5 5 0 0 1 13 8 V10"></path><rect x="2" y="10" width="3" height="4" rx="1"></rect><rect x="11" y="10" width="3" height="4" rx="1"></rect></svg></button>
            </div>
            <a href="States.dc.html" class="amq-select" style="min-width: 0; width: 148px; height: 28px; text-decoration: none; box-sizing: border-box;" aria-label="Side-chain filter">
              <span>{{sel.scMode}}</span><span style="color: var(--ink-muted); font-size: 12px;">{{sel.scRange}}</span>
              <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 L6 7.5 L9 4.5"></path></svg>
            </a>
            <sc-if value="{{sel.spectral}}" hint-placeholder-val="{{false}}">
              <button class="chip on" style="height: 28px; width: 148px;" aria-pressed="true">Spectral Tilt</button>
            </sc-if>
          </div>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 8px; width: 148px; position: relative;">
          <sc-if value="{{plOpen}}" hint-placeholder-val="{{false}}">
            <div role="menu" aria-label="Placement" class="amq-panel" style="position: absolute; left: 0; bottom: 124px; width: 148px; padding: 6px; display: flex; flex-direction: column; box-sizing: border-box;">
              <sc-for list="{{places}}" as="o" hint-placeholder-count="5">
                <button role="menuitemradio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: {{o.bg}}; color: #eceaf0; font: 500 13px/16px var(--font-sans); text-align: left;"><span style="width: 14px; height: 14px; border-radius: 9999px; box-shadow: {{o.ring}}; flex-shrink: 0;"></span>{{o.name}}</button>
              </sc-for>
            </div>
          </sc-if>
          <button class="amq-select" style="min-width: 0; width: 148px;" aria-label="Placement" aria-haspopup="menu" aria-expanded="{{plOpen}}" onClick="{{togglePl}}">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="8" r="4"></circle><circle cx="10" cy="8" r="4"></circle></svg>
            <span>{{sel.place}}</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 L6 7.5 L9 4.5"></path></svg>
          </button>
          <div style="display: flex; gap: 4px;">
            <button class="chip {{sel.dynClass}}" style="height: 32px; flex-grow: 1;" aria-pressed="{{sel.dyn}}" onClick="{{toggleDyn}}">Dynamic</button>
            <button class="chip {{sel.specClass}}" style="height: 32px; flex-grow: 1;" aria-pressed="{{sel.spectral}}" onClick="{{toggleSpec}}">Spectral</button>
          </div>
          <div style="display: flex; gap: 4px; justify-content: flex-end;">
            <a href="States.dc.html" class="amq-icon" aria-label="Solo band" title="Solo"><svg viewBox="0 0 16 16"><path d="M3 10 V8 A5 5 0 0 1 13 8 V10"></path><rect x="2" y="10" width="3" height="4" rx="1"></rect><rect x="11" y="10" width="3" height="4" rx="1"></rect></svg></a>
            <button class="amq-icon" aria-label="Delete band"><svg viewBox="0 0 16 16"><path d="M4 4 L12 12 M12 4 L4 12"></path></svg></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Status bar -->
  <footer class="amq-bar" style="flex-shrink: 0; justify-content: space-between; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="Interactions.dc.html" class="amq-select" style="min-width: 0; height: 28px; text-decoration: none;"><span>Bands</span><span style="color: var(--ink-muted);">5 / 24</span></a>
      <span class="sep" style="width: 1px; height: 20px; background: var(--line-hairline);"></span>
      <a href="Processing.dc.html" class="amq-select" style="min-width: 0; height: 28px; text-decoration: none;">
        <span>Natural Phase</span><span style="color: var(--ink-muted);">320 smp</span>
        <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 7.5 L6 4.5 L9 7.5"></path></svg>
      </a>
      <a href="Analyzer.dc.html" class="amq-select" style="min-width: 0; height: 28px; text-decoration: none;">
        <span style="color: var(--ink-muted);">Analyzer</span><span>Pre + Post</span>
      </a>
      <button class="amq-icon" aria-label="Freeze analyzer" title="Freeze"><svg viewBox="0 0 16 16"><path d="M8 2 V14 M2.8 5 L13.2 11 M2.8 11 L13.2 5"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <button class="chip on" aria-pressed="true">Auto Gain</button>
      <span style="color: var(--ink-muted);">Gain Scale</span><span>100 %</span>
      <span class="sep" style="width: 1px; height: 20px; background: var(--line-hairline);"></span>
      <span style="color: var(--ink-muted);">Output</span>
      <button class="chip" aria-label="Output pan mode">L/R</button>
      <span class="amq-readout is-accent">+0.0 dB</span>
      <button class="amq-icon" aria-label="Invert polarity" title="Invert"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.5"></circle><path d="M12.5 3.5 L3.5 12.5"></path></svg></button>
      <button class="amq-icon" aria-label="Bypass plugin"><svg viewBox="0 0 16 16"><path d="M8 2 V8"></path><path d="M4.5 4.5 A5 5 0 1 0 11.5 4.5"></path></svg></button>
    </div>
  </footer>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: [2], focus: 2, dyn: { 1: true, 3: true }, spec: { 3: true }, auto: { 1: true, 2: true, 3: false, 4: true }, place: {}, plOpen: false }; }
  pt(c, r, d) { const a = d * Math.PI / 180; return [c + r * Math.sin(a), c - r * Math.cos(a)]; }
  arc(c, r, d0, d1) {
    if (Math.abs(d1 - d0) < 0.5) return '';
    const p0 = this.pt(c, r, d0), p1 = this.pt(c, r, d1);
    const large = Math.abs(d1 - d0) > 180 ? 1 : 0, sweep = d1 > d0 ? 1 : 0;
    return 'M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + large + ' ' + sweep + ' ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1);
  }
  knob(label, val, n, size, bip, opt) {
    const o = opt || {};
    const c = size / 2, sw = size > 70 ? 4 : 3, r = c - sw / 2 - 1, d = -135 + 270 * n, fr = r - sw - 3;
    const t0 = this.pt(c, fr * 0.3, d), t1 = this.pt(c, fr - 4, d);
    const gr = o.gr ? this.arc(c, r - sw - 1, 0, Math.max(-135, Math.min(135, o.gr / 30 * 135))) : '';
    return { label, val, size, vb: '0 0 ' + size + ' ' + size, c, fr, sw, op: o.dim ? 0.35 : 1, gr, grc: o.color || 'none',
      track: this.arc(c, r, -135, 135), arc: bip ? this.arc(c, r, 0, d) : this.arc(c, r, -135, d),
      tick: 'M' + t0[0].toFixed(1) + ' ' + t0[1].toFixed(1) + ' L' + t1[0].toFixed(1) + ' ' + t1[1].toFixed(1) };
  }
  renderVals() {
    const G = { bell: 'M1 12 C5 12 6 4 8 4 C10 4 11 12 15 12', lc: 'M1 14 C4 14 5 4 9 4 L15 4', hs: 'M1 11 L6 11 C9 11 9 5 12 5 L15 5' };
    const B = [
      { n: 1, shape: 'Low Cut', glyph: G.lc, slope: '24 dB/oct', freq: '32 Hz', gain: '', q: 'Q 0.71', place: 'Stereo', color: '#c4ee3c', hx: 171, hy: 336, fn: 0.145, gn: 0.5, qn: 0.454, hasGain: false, g: 0, r: 0, range: '', rn: 0.5, gr: 0, scMode: 'Band', scRange: '20–45 Hz' },
      { n: 2, shape: 'Bell', glyph: G.bell, slope: '12 dB/oct', freq: '180 Hz', gain: '−3.0 dB', q: 'Q 1.40', place: 'Mid', color: '#ff4d4d', hx: 426, hy: 414, fn: 0.361, gn: 0.45, qn: 0.546, hasGain: true, g: -3, r: -2, range: '−2.0 dB', rn: 0.467, gr: -1.8, scMode: 'Band', scRange: '120–270 Hz' },
      { n: 3, shape: 'Bell', glyph: G.bell, slope: '12 dB/oct', freq: '1.82 kHz', gain: '+4.5 dB', q: 'Q 0.71', place: 'Stereo', color: '#3aa0ff', hx: 767, hy: 219, fn: 0.65, gn: 0.575, qn: 0.454, hasGain: true, g: 4.5, r: 3, range: '+3.0 dB', rn: 0.55, gr: 1.2, scMode: 'Band', scRange: '0.9–3.6 kHz' },
      { n: 4, shape: 'Bell', glyph: G.bell, slope: '12 dB/oct', freq: '3.40 kHz', gain: '−2.5 dB', q: 'Q 4.00', place: 'Side', color: '#d84cf2', hx: 859, hy: 401, fn: 0.727, gn: 0.458, qn: 0.688, hasGain: true, g: -2.5, r: -2.5, range: '−2.5 dB', rn: 0.458, gr: -1.8, scMode: 'Free', scRange: '2.5–6.0 kHz' },
      { n: 5, shape: 'High Shelf', glyph: G.hs, slope: '12 dB/oct', freq: '9.00 kHz', gain: '+3.0 dB', q: 'Q 0.71', place: 'Stereo', color: '#7d62ff', hx: 1003, hy: 258, fn: 0.85, gn: 0.55, qn: 0.454, hasGain: true, g: 3, r: -3, range: '−3.0 dB', rn: 0.45, gr: 0, scMode: 'Band', scRange: '6.0–14 kHz' }
    ];
    const st = this.state, sel = st.sel, s = st.focus, cur = B[s];
    const dyn = !!st.dyn[s], spectral = dyn && !!st.spec[s], auto = st.auto[s] !== false;
    const place = st.place[s] || cur.place;
    const bands = B.map((b, i) => {
      const on = sel.indexOf(i) >= 0, size = on ? 22 : 18;
      return { color: b.color, size, left: b.hx - size / 2, top: b.hy - size / 2, selected: on ? 'true' : 'false',
        ring: on ? '0 0 0 3px #eceaf0, 0 0 0 5px #17161a, 0 2px 8px rgba(0,0,0,0.6)' : '0 0 0 2px #17161a, 0 2px 6px rgba(0,0,0,0.6)',
        aria: 'Band ' + b.n + ', ' + b.shape + ', ' + b.freq, tip: '#' + b.n + ' ' + b.shape + ' (Shift-click adds to the selection)',
        pick: (e) => {
          if (e && e.shiftKey) {
            const has = sel.indexOf(i) >= 0;
            const next = has ? sel.filter((x) => x !== i) : sel.concat([i]);
            this.setState({ sel: next.length ? next : [i], focus: has && next.length ? next[next.length - 1] : i, plOpen: false });
          } else this.setState({ sel: [i], focus: i, plOpen: false });
        } };
    });
    const ranges = B.filter((b, i) => !!st.dyn[i] && b.hasGain && b.r !== 0).map((b) => {
      const y2 = 336 - (b.g + b.r) * 26, top = Math.min(b.hy, y2);
      return { x: b.hx, top, h: Math.abs(y2 - b.hy), hx: b.hx - 7, hy: y2 - 7, color: b.color, aria: 'Band ' + b.n + ' dynamic range ' + b.range };
    });
    const fo = {}; B.forEach((b, i) => { fo['b' + (i + 1)] = sel.indexOf(i) >= 0 ? 0.55 : 0.38; });
    const dk = [];
    if (cur.hasGain) dk.push(this.knob('Range', cur.range, cur.rn, 48, true, { gr: cur.gr, color: cur.color }));
    dk.push(this.knob('Threshold', auto ? 'Auto' : '−24 dBFS', auto ? 1 : 0.73, 48, false, { dim: auto }));
    dk.push(this.knob('Attack', '50 %', 0.5, 48, false, { dim: auto }));
    dk.push(this.knob('Release', '50 %', 0.5, 48, false, { dim: auto }));
    if (spectral) dk.push(this.knob('Density', '50 %', 0.5, 48, false));
    const knobs = [this.knob('Freq', cur.freq, cur.fn, 64, false)];
    if (cur.hasGain) knobs.push(this.knob('Gain', cur.gain, cur.gn, 88, true));
    knobs.push(this.knob('Q', cur.q, cur.qn, 64, false));
    const places = ['Stereo', 'Left', 'Right', 'Mid', 'Side'].map((name) => ({ name, on: name === place ? 'true' : 'false',
      bg: name === place ? '#2b2a30' : 'transparent', ring: name === place ? 'inset 0 0 0 4px #ffb81c' : 'inset 0 0 0 1.5px #a5a3ad',
      pick: () => this.setState({ place: Object.assign({}, st.place, { [s]: name }), plOpen: false }) }));
    return {
      bands, fo, ranges, knobs, dknobs: dk, places, plOpen: st.plOpen, multi: sel.length > 1,
      live: { b2: st.dyn[1] ? 0.8 : 0, b4: st.dyn[3] ? 0.8 : 0 },
      sel: Object.assign({}, cur, { dyn, spectral, auto, place, autoClass: auto ? 'on' : '', dynClass: dyn ? 'on' : '', specClass: spectral ? 'on' : '',
        rx: cur.hx + 18 > 1000 ? cur.hx - 200 : cur.hx + 18, ry: cur.hy - 44 }),
      togglePl: () => this.setState({ plOpen: !st.plOpen }),
      toggleAuto: () => this.setState({ auto: Object.assign({}, st.auto, { [s]: !auto }) }),
      toggleDyn: () => this.setState({ dyn: Object.assign({}, st.dyn, { [s]: !dyn }) }),
      toggleSpec: () => this.setState({ dyn: Object.assign({}, st.dyn, { [s]: true }), spec: Object.assign({}, st.spec, { [s]: !spectral }) })
    };
  }
}
</script>
