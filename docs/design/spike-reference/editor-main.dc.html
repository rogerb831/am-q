<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Am-Q editor</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/am-q/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
:root{--surface-000:#0d0d10;--surface-100:#17161a;--surface-200:#201f24;--surface-300:#2b2a30;--surface-400:#37363d;--line-grid:#26252b;--line-hairline:#3d3c43;--line-zero:#8f8d96;--ink:#eceaf0;--ink-muted:#a5a3ad;--ink-axis:#8c8a93;--ink-disabled:#5e5c66;--accent:#ffb81c;--accent-hover:#ffc94d;--accent-ink:#1a1305;--focus:#ffb81c;--band-1:#c4ee3c;--band-2:#ff4d4d;--band-3:#3aa0ff;--band-4:#d84cf2;--band-5:#7d62ff;--band-6:#2fe0b0;--band-7:#ff8a3d;--band-8:#ff63ae;--analyzer-pre:#3a3940;--analyzer-post:#7c7a84;--analyzer-sc:#5b6e8a;--meter-ok:#3faf3a;--meter-hot:#d9d33a;--signal-clip:#ff3b30;--signal-solo:#2fe0b0;--font-sans:"Inter","Segoe UI",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--radius-sm:4px;--radius-md:8px;--radius-lg:16px;--radius-full:9999px;--size-handle:18px;--size-meter:6px;--size-bar:44px;--opacity-band-fill:0.38;--opacity-band-idle:0.18;--opacity-bypassed:0.35;--shadow-panel:0 16px 40px rgba(0,0,0,0.55),0 0 0 1px #3d3c43;--shadow-handle:0 0 0 2px #17161a,0 2px 6px rgba(0,0,0,0.6);--shadow-knob:inset 0 1px 0 rgba(255,255,255,0.06),0 4px 10px rgba(0,0,0,0.5)}
body{margin:0;background:#17161a}
a{color:#ffb81c}a:hover{color:#ffc94d}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #ffb81c;outline-offset:2px}
.hbtn{position:absolute;border:0;padding:0;border-radius:9999px}
.chip{height:28px;padding:0 10px;border-radius:8px;border:0;background:#2b2a30;color:#eceaf0;font:600 13px/16px "Inter",sans-serif}
.chip:hover{background:#37363d}
.chip.on{background:#ffb81c;color:#1a1305}
</style>
</helmet>
<div style="width: 1280px; height: 760px; display: flex; flex-direction: column; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); font-variant-numeric: tabular-nums; overflow: hidden; position: relative;">

  <!-- Top bar -->
  <header class="amq-bar" style="justify-content: space-between; flex-shrink: 0; position: relative; z-index: 3;">
    <div style="display: flex; align-items: center; gap: 24px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="amq-wordmark" aria-label="Am-Q" role="img">Am-<svg viewBox="0 0 64 64" aria-hidden="true" style="width: 1em; height: 1em; vertical-align: -0.2em;"><circle cx="28" cy="28" r="17.5" fill="none" stroke="#ffb81c" stroke-width="11"></circle><path d="M37 37 C39.5 39.5 40.5 42.5 42.5 44.5" fill="none" stroke="#ffb81c" stroke-width="11" stroke-linecap="round"></path><circle cx="56" cy="56" r="7" fill="#ffb81c"></circle></svg></span>
      </div>
      <div class="sep" style="width: 1px; height: 20px; background: var(--line-hairline);"></div>
      <div style="display: flex; align-items: center; gap: 4px;">
        <button class="amq-icon" aria-label="Undo"><svg viewBox="0 0 16 16"><path d="M5 3 L2 6 L5 9"></path><path d="M2 6 H10 A4 4 0 0 1 10 14 H7"></path></svg></button>
        <button class="amq-icon" aria-label="Redo"><svg viewBox="0 0 16 16"><path d="M11 3 L14 6 L11 9"></path><path d="M14 6 H6 A4 4 0 0 0 6 14 H9"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 4px;">
        <button class="chip on" aria-pressed="true">A</button>
        <button class="chip" aria-pressed="false">B</button>
        <button class="amq-icon" aria-label="Copy A to B"><svg viewBox="0 0 16 16"><path d="M3 8 H12"></path><path d="M9 5 L12 8 L9 11"></path></svg></button>
      </div>
    </div>
    <div style="position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px;">
      <button class="amq-icon" aria-label="Previous preset"><svg viewBox="0 0 16 16"><path d="M10 3 L5 8 L10 13"></path></svg></button>
      <button style="border: 0; background: var(--surface-300); border-radius: 8px; height: 32px; padding: 0 16px; display: flex; align-items: center; gap: 8px; min-width: 220px; justify-content: center; color: var(--ink);">
        <span class="amq-preset" style="min-width: 0;">Vocal Air Lift</span>
        <span style="font: 400 12px/16px var(--font-sans); color: var(--ink-muted);">(edited)</span>
      </button>
      <button class="amq-icon" aria-label="Next preset"><svg viewBox="0 0 16 16"><path d="M6 3 L11 8 L6 13"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="Match.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; background: var(--surface-300); color: var(--ink); font: 500 13px/16px var(--font-sans); text-decoration: none;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#eceaf0" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M1 10 C4 10 4 5 7 5 C10 5 10 11 15 8"></path><path d="M1 12 C4 12 5 8 8 8 C11 8 12 10 15 10" stroke="#a5a3ad" stroke-dasharray="2 2"></path></svg>
        EQ Match
      </a>
      <a href="Analyzer.dc.html" class="amq-icon" aria-label="Interface and analyzer settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.5 V3.5 M8 12.5 V14.5 M1.5 8 H3.5 M12.5 8 H14.5 M3.4 3.4 L4.8 4.8 M11.2 11.2 L12.6 12.6 M3.4 12.6 L4.8 11.2 M11.2 4.8 L12.6 3.4"></path></svg></a>
      <button class="amq-icon" aria-label="Full screen"><svg viewBox="0 0 16 16"><path d="M2 6 V2 H6 M10 2 H14 V6 M14 10 V14 H10 M6 14 H2 V10"></path></svg></button>
      <button class="amq-icon" aria-label="Help"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"></circle><path d="M6.5 6.2 A1.6 1.6 0 1 1 8.6 7.7 C8 8 8 8.6 8 9.2"></path><path d="M8 11.5 V11.6"></path></svg></button>
    </div>
  </header>

  <!-- Graph -->
  <main style="position: relative; flex-grow: 1; overflow: hidden;" aria-label="EQ graph">

    <sc-for list="{{ranges}}" as="r" hint-placeholder-count="2">
      <div style="position: absolute; left: {{r.x}}px; top: {{r.top}}px; width: 0; height: {{r.h}}px; border-left: 1px dashed {{r.color}};" aria-hidden="true"></div>
      <button class="hbtn" style="left: {{r.hx}}px; top: {{r.hy}}px; width: 14px; height: 14px; background: #17161a; box-shadow: inset 0 0 0 2px {{r.color}}, 0 2px 6px rgba(0,0,0,0.6);" aria-label="{{r.aria}}" title="{{r.aria}}"></button>
    </sc-for>
    <sc-for list="{{bands}}" as="b" hint-placeholder-count="5">
      <button class="hbtn" style="left: {{b.left}}px; top: {{b.top}}px; width: {{b.size}}px; height: {{b.size}}px; background: {{b.color}}; box-shadow: {{b.ring}};" aria-label="{{b.aria}}" aria-pressed="{{b.selected}}" onClick="{{b.pick}}" title="{{b.aria}}"></button>
    </sc-for>

    <div class="amq-readout" style="position: absolute; left: {{sel.rx}}px; top: {{sel.ry}}px; box-shadow: 0 0 0 1px #3d3c43;">
      <span class="dot" style="background: {{sel.color}};"></span>
      <span>{{sel.freq}}</span><span style="color: var(--ink-muted);">·</span><span>{{sel.gain}}</span><span style="color: var(--ink-muted);">·</span><span>{{sel.q}}</span>
    </div>

    <!-- Band panel -->
    <section class="amq-panel" aria-label="Band editor" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 16px; padding: 16px 20px;">
      <div style="display: flex; align-items: center; gap: 24px;">
        <div style="display: flex; flex-direction: column; gap: 8px; width: 148px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="width: 10px; height: 10px; border-radius: 9999px; background: {{sel.color}};"></span>
            <span style="font: 600 13px/16px var(--font-sans);">Band #{{sel.n}}</span>
            <span style="flex-grow: 1;"></span>
            <button class="amq-icon" aria-label="Band enabled" aria-pressed="true" title="Enable/disable band (Alt-click the handle)"><svg viewBox="0 0 16 16"><path d="M8 2 V8"></path><path d="M4.5 4.5 A5 5 0 1 0 11.5 4.5"></path></svg></button>
          </div>
          <button class="amq-select" style="min-width: 0; width: 148px;" aria-label="Filter shape">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="{{sel.glyph}}"></path></svg>
            <span>{{sel.shape}}</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 L6 7.5 L9 4.5"></path></svg>
          </button>
          <button class="amq-select" style="min-width: 0; width: 148px;" aria-label="Slope">
            <span>{{sel.slope}}</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 L6 7.5 L9 4.5"></path></svg>
          </button>
        </div>

        <div style="display: flex; align-items: flex-end; gap: 16px;">
          <sc-for list="{{knobs}}" as="k" hint-placeholder-count="3">
            <div class="amq-knob">
              <svg width="{{k.size}}" height="{{k.size}}" viewBox="{{k.vb}}" style="filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));" aria-hidden="true">
                <circle class="face" cx="{{k.c}}" cy="{{k.c}}" r="{{k.fr}}"></circle>
                <path class="track" d="{{k.track}}" stroke-width="{{k.sw}}"></path>
                <path class="value" d="{{k.arc}}" stroke-width="{{k.sw}}"></path>
                <path class="tick" d="{{k.tick}}" stroke-width="2"></path>
              </svg>
              <span class="lbl">{{k.label}}</span>
              <span class="val">{{k.val}}</span>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{sel.dyn}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: flex-end; gap: 12px; padding-left: 24px; box-shadow: -1px 0 0 #3d3c43;">
            <sc-for list="{{dknobs}}" as="k" hint-placeholder-count="4">
              <div class="amq-knob">
                <svg width="{{k.size}}" height="{{k.size}}" viewBox="{{k.vb}}" style="filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));" aria-hidden="true">
                  <circle class="face" cx="{{k.c}}" cy="{{k.c}}" r="{{k.fr}}"></circle>
                  <path class="track" d="{{k.track}}" stroke-width="{{k.sw}}"></path>
                  <path class="value" d="{{k.arc}}" stroke-width="{{k.sw}}"></path>
                  <path class="tick" d="{{k.tick}}" stroke-width="2"></path>
                </svg>
                <span class="lbl">{{k.label}}</span>
                <span class="val">{{k.val}}</span>
              </div>
            </sc-for>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px; width: 148px;">
            <span style="font: 600 12px/14px var(--font-sans); letter-spacing: 0.06em; color: var(--ink-muted);">SIDE CHAIN</span>
            <div style="display: flex; gap: 4px;">
              <button class="chip on" style="height: 28px; flex-grow: 1;" aria-pressed="true">Int</button>
              <button class="chip" style="height: 28px; flex-grow: 1;" aria-pressed="false">Ext</button>
              <button class="amq-icon" aria-label="Listen to side chain" title="Listen"><svg viewBox="0 0 16 16"><path d="M3 10 V8 A5 5 0 0 1 13 8 V10"></path><rect x="2" y="10" width="3" height="4" rx="1"></rect><rect x="11" y="10" width="3" height="4" rx="1"></rect></svg></button>
            </div>
            <button class="amq-select" style="min-width: 0; width: 148px; height: 28px;" aria-label="Side-chain filter">
              <span>{{sel.scMode}}</span><span style="color: var(--ink-muted); font-size: 12px;">{{sel.scRange}}</span>
              <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 L6 7.5 L9 4.5"></path></svg>

        <div style="display: flex; flex-direction: column; gap: 8px; width: 148px;">
          <button class="amq-select" style="min-width: 0; width: 148px;" aria-label="Stereo placement">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="8" r="4"></circle><circle cx="10" cy="8" r="4"></circle></svg>
            <span>{{sel.stereo}}</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 L6 7.5 L9 4.5"></path></svg>
          </button>
          <div style="display: flex; gap: 4px;">
            <button class="chip {{sel.dynClass}}" style="height: 32px; flex-grow: 1;" aria-pressed="{{sel.dyn}}" onClick="{{toggleDyn}}">Dynamic</button>
            <button class="chip {{sel.specClass}}" style="height: 32px; flex-grow: 1;" aria-pressed="{{sel.spectral}}" onClick="{{toggleSpec}}">Spectral</button>

          <div style="display: flex; gap: 4px; justify-content: flex-end;">
            <button class="amq-icon" aria-label="Solo band"><svg viewBox="0 0 16 16"><path d="M3 10 V8 A5 5 0 0 1 13 8 V10"></path><rect x="2" y="10" width="3" height="4" rx="1"></rect><rect x="11" y="10" width="3" height="4" rx="1"></rect></svg></button>
            <button class="amq-icon" aria-label="Delete band"><svg viewBox="0 0 16 16"><path d="M4 4 L12 12 M12 4 L4 12"></path></svg></button>

        </div>
      </div>

    </section>
  </main>

  <!-- Status bar -->
  <footer class="amq-bar" style="flex-shrink: 0; justify-content: space-between; gap: 16px;">

      <a href="Interactions.dc.html" class="amq-select" style="min-width: 0; height: 28px; text-decoration: none;"><span>Bands</span><span style="color: var(--ink-muted);">5 / 24</span></a>
      <span class="sep" style="width: 1px; height: 20px; background: var(--line-hairline);"></span>
      <a href="Processing.dc.html" class="amq-select" style="min-width: 0; height: 28px; text-decoration: none;">
        <span>Natural Phase</span><span style="color: var(--ink-muted);">[latency]</span>
        <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 7.5 L6 4.5 L9 7.5"></path></svg>

      <a href="Analyzer.dc.html" class="amq-select" style="min-width: 0; height: 28px; text-decoration: none;">

      <button class="amq-icon" aria-label="Bypass plugin"><svg viewBox="0 0 16 16"><path d="M8 2 V8"></path><path d="M4.5 4.5 A5 5 0 1 0 11.5 4.5"></path></svg></button>
    </div>
  </footer>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 2, dyn: { 1: true, 3: true }, spec: { 3: true } }; }
  pt(c, r, d) { const a = d * Math.PI / 180; return [c + r * Math.sin(a), c - r * Math.cos(a)]; }
  arc(c, r, d0, d1) {
    if (Math.abs(d1 - d0) < 0.5) return '';
    const p0 = this.pt(c, r, d0), p1 = this.pt(c, r, d1);
    const large = Math.abs(d1 - d0) > 180 ? 1 : 0, sweep = d1 > d0 ? 1 : 0;
    return 'M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + large + ' ' + sweep + ' ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1);
  }
  knob(label, val, n, size, bip) {
    const c = size / 2, sw = size > 70 ? 4 : 3, r = c - sw / 2 - 1, d = -135 + 270 * n, fr = r - sw - 3;
    const t0 = this.pt(c, fr * 0.3, d), t1 = this.pt(c, fr - 4, d);
    return { label, val, size, vb: '0 0 ' + size + ' ' + size, c, fr, sw,
      track: this.arc(c, r, -135, 135), arc: bip ? this.arc(c, r, 0, d) : this.arc(c, r, -135, d),
      tick: 'M' + t0[0].toFixed(1) + ' ' + t0[1].toFixed(1) + ' L' + t1[0].toFixed(1) + ' ' + t1[1].toFixed(1) };
  }
  renderVals() {
    const G = { bell: 'M1 12 C5 12 6 4 8 4 C10 4 11 12 15 12', lc: 'M1 14 C4 14 5 4 9 4 L15 4', hs: 'M1 11 L6 11 C9 11 9 5 12 5 L15 5' };
    const B = [
      { n: 1, shape: 'Low Cut', glyph: G.lc, slope: '24 dB/oct', freq: '32 Hz', gain: '0.0 dB', q: 'Q 0.71', stereo: 'Stereo', color: '#c4ee3c', hx: 171, hy: 388, fn: 0.145, gn: 0.5, qn: 0.454, range: '', rn: 0.5, g: 0, r: -3, scMode: 'Band', scRange: '20–45 Hz' },
      { n: 2, shape: 'Bell', glyph: G.bell, slope: '12 dB/oct', freq: '180 Hz', gain: '−3.5 dB', q: 'Q 1.40', stereo: 'Mid', color: '#ff4d4d', hx: 426, hy: 397, fn: 0.361, gn: 0.442, qn: 0.546, range: '−3.0 dB', rn: 0.45, g: -3.5, r: -3, scMode: 'Band', scRange: '120–270 Hz' },
      { n: 3, shape: 'Bell', glyph: G.bell, slope: '12 dB/oct', freq: '1.82 kHz', gain: '+4.5 dB', q: 'Q 0.71', stereo: 'Stereo', color: '#3aa0ff', hx: 767, hy: 258, fn: 0.65, gn: 0.575, qn: 0.454, range: '+3.0 dB', rn: 0.55, g: 4.5, r: 3, scMode: 'Band', scRange: '0.9–3.6 kHz' },
      { n: 4, shape: 'Bell', glyph: G.bell, slope: '12 dB/oct', freq: '3.40 kHz', gain: '−2.5 dB', q: 'Q 4.00', stereo: 'Side', color: '#d84cf2', hx: 859, hy: 379, fn: 0.727, gn: 0.458, qn: 0.688, range: '−4.0 dB', rn: 0.433, g: -2.5, r: -4, scMode: 'Free', scRange: '2.5–6.0 kHz' },
      { n: 5, shape: 'High Shelf', glyph: G.hs, slope: '12 dB/oct', freq: '9.00 kHz', gain: '+3.0 dB', q: 'Q 0.71', stereo: 'Stereo', color: '#7d62ff', hx: 1003, hy: 284, fn: 0.85, gn: 0.55, qn: 0.454, range: '', rn: 0.5, g: 3, r: -3, scMode: 'Band', scRange: '6.0–14 kHz' }
    ];
    const s = this.state.sel, cur = B[s];
    const dyn = !!this.state.dyn[s], spectral = dyn && !!this.state.spec[s];
    const bands = B.map((b, i) => {
      const on = i === s, size = on ? 22 : 18;
      return { color: b.color, size, left: b.hx - size / 2, top: b.hy - size / 2, selected: on ? 'true' : 'false',
        ring: on ? '0 0 0 3px #eceaf0, 0 0 0 5px #17161a, 0 2px 8px rgba(0,0,0,0.6)' : '0 0 0 2px #17161a, 0 2px 6px rgba(0,0,0,0.6)',
        aria: 'Band ' + b.n + ', ' + b.shape + ', ' + b.freq, pick: () => this.setState({ sel: i }) };
    });
    const ranges = B.filter((b, i) => !!this.state.dyn[i] && b.shape !== 'Low Cut').map((b) => {
      const y2 = 336 - (b.g + b.r) * 17.333, top = Math.min(b.hy, y2);
      return { x: b.hx, top, h: Math.abs(y2 - b.hy), hx: b.hx - 7, hy: y2 - 7, color: b.color, aria: 'Band ' + b.n + ' dynamic range ' + (b.range || '') };
    });
    const fo = {}; B.forEach((b, i) => { fo['b' + (i + 1)] = i === s ? 0.55 : 0.38; });
    const dk = [
      this.knob('Range', cur.range || '−6.0 dB', cur.rn, 48, true),
      this.knob('Threshold', 'Auto', 1, 48, false),
      this.knob('Attack', '50 %', 0.5, 48, false),
      this.knob('Release', '50 %', 0.5, 48, false)
    ];
    if (spectral) dk.push(this.knob('Density', '50 %', 0.5, 48, false));
    return {
      bands, fo, ranges,
      sel: Object.assign({}, cur, { dyn, spectral, dynClass: dyn ? 'on' : '', specClass: spectral ? 'on' : '',
        rx: Math.min(cur.hx + 18, 1000), ry: cur.hy - 44 }),
      knobs: [ this.knob('Freq', cur.freq, cur.fn, 64, false), this.knob('Gain', cur.gain, cur.gn, 88, true), this.knob('Q', cur.q, cur.qn, 64, false) ],
      dknobs: dk,
      toggleDyn: () => this.setState({ dyn: Object.assign({}, this.state.dyn, { [s]: !dyn }) }),
      toggleSpec: () => this.setState({ dyn: Object.assign({}, this.state.dyn, { [s]: true }), spec: Object.assign({}, this.state.spec, { [s]: !spectral }) })
    };
  }
}
</script>
